<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hora en Chile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --sky-top: #0b1d3a;
    --sky-mid: #16335f;
    --sky-low: #2f5a8f;
    --ridge: #08142a;
    --ridge-2: #0d2040;
    --fg: #f3f7ff;
    --fg-soft: rgba(243, 247, 255, .68);
    --line: rgba(243, 247, 255, .28);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root[data-phase="dawn"]  { --sky-top:#3a3a7a; --sky-mid:#c8688a; --sky-low:#ffb785; --ridge:#2a2350; --ridge-2:#4a3768; --fg:#fff8f2; --fg-soft:rgba(255,248,242,.78); --line:rgba(255,248,242,.38); }
  :root[data-phase="day"]   { --sky-top:#1f6fd1; --sky-mid:#4fa3ee; --sky-low:#bfe3ff; --ridge:#2b4f7a; --ridge-2:#4a76a6; --fg:#ffffff; --fg-soft:rgba(255,255,255,.86); --line:rgba(255,255,255,.45); }
  :root[data-phase="dusk"]  { --sky-top:#2a2154; --sky-mid:#b5476a; --sky-low:#ff9a5a; --ridge:#1b1438; --ridge-2:#3a2450; --fg:#fff6ee; --fg-soft:rgba(255,246,238,.8); --line:rgba(255,246,238,.4); }
  :root[data-phase="night"] { --sky-top:#050d1f; --sky-mid:#0f2447; --sky-low:#1f4373; }

  *, *::before, *::after { box-sizing: inherit; margin: 0; }
  html { height: 100%; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  @media (min-width: 1800px) { html { font-size: 20px; } }
  @media (min-width: 2500px) { html { font-size: 28px; } }
  body {
    height: 100%;
    min-height: 100%;
    background: var(--sky-top);
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-low) 100%);
    color: var(--fg);
    font-family: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    overflow-x: hidden;
    overflow-y: auto;
    position: relative;
  }
  main {
    margin: auto;
    position: relative;
    z-index: 2;
    width: min(100%, 70rem);
    padding: 1.5rem clamp(.75rem, 5vw, 3rem) max(12vh, 110px);
    text-align: center;
  }
  .place { font-size: clamp(1rem, 2.6vw, 1.35rem); font-weight: 500; }
  .date  { margin-top: .35rem; font-size: clamp(.9rem, 2.2vw, 1.1rem); color: var(--fg-soft); text-transform: capitalize; }

  .t12 {
    margin-top: clamp(1.5rem, 5vh, 3rem);
    font-weight: 300;
    font-size: clamp(2.6rem, min(14vw, 19vh), 9rem);
    line-height: 1;
    letter-spacing: -.03em;
    font-variant-numeric: tabular-nums;
    display: flex; justify-content: center; align-items: baseline; gap: .12em;
  }
  .t12 .ampm { font-size: .24em; font-weight: 700; letter-spacing: .02em; }
  .t12 .sec  { opacity: .62; }

  .divider {
    width: min(70%, 420px);
    height: 1px;
    background: var(--line);
    margin: clamp(1.2rem, 4vh, 2.2rem) auto;
  }
  .t24 {
    font-weight: 500;
    font-size: clamp(1.7rem, min(7vw, 9.5vh), 4.5rem);
    line-height: 1;
    letter-spacing: -.01em;
    font-variant-numeric: tabular-nums;
  }
  .label { margin-top: .6rem; font-size: clamp(.8rem, 2vw, 1rem); color: var(--fg-soft); }
  .zone  { margin-top: clamp(1.5rem, 5vh, 2.5rem); font-size: clamp(.8rem, 2vw, .95rem); color: var(--fg-soft); }

  svg.andes { position: fixed; pointer-events: none; left: 0; right: 0; bottom: 0; width: 100%; height: 30vh; height: 30dvh; min-height: 120px; max-height: 40vh; z-index: 1; display: block; }
  svg.andes .far  { fill: var(--ridge-2); }
  svg.andes .near { fill: var(--ridge); }

  .weather { margin: clamp(1.4rem, 4vh, 2.2rem) auto 0; width: min(100%, 32rem); }
  .weather .wplace { font-size: clamp(.85rem, 2vw, 1rem); color: var(--fg-soft); }
  .weather .wmain { margin-top: .4rem; display: flex; justify-content: center; align-items: center; gap: .9rem; }
  .weather .wicon { font-size: clamp(2.4rem, 8vw, 3.4rem); line-height: 1; }
  .weather .wtemp { font-size: clamp(2.4rem, 8vw, 3.6rem); font-weight: 300; line-height: 1; letter-spacing: -.02em; }
  .weather .wcond { font-size: clamp(1rem, 2.6vw, 1.2rem); font-weight: 500; margin-top: .2rem; }
  .weather .wrow { margin-top: .9rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(5.2rem, 1fr)); gap: .5rem; font-size: clamp(.8rem, 2.2vw, .95rem); color: var(--fg-soft); }
  .weather .wrow span { display: flex; flex-direction: column; align-items: center; gap: .1rem; padding: .5rem .35rem; border-radius: 14px; background: rgba(255,255,255,.08); border: 1px solid var(--line); }
  .weather .wrow b { color: var(--fg); font-weight: 700; font-size: 1.1em; }
  .weather .wnote { margin-top: .7rem; font-size: .8rem; color: var(--fg-soft); }

  canvas#fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; display: block; }
  .fx-tabs { margin-top: .5rem; display: flex; flex-wrap: wrap; justify-content: center; gap: .4rem; }
  .fx-tabs button { font: inherit; font-size: .78rem; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: .3rem .75rem; cursor: pointer; }
  .fx-tabs button[aria-pressed="true"] { background: var(--fg); color: var(--sky-top); border-color: var(--fg); }
  .fx-tabs button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

  canvas#sea { position: fixed; left: 0; bottom: 0; width: 100%; z-index: 2; pointer-events: none; display: block; }
  .glass {
    max-width: 55rem; margin: 0 auto;
    padding: clamp(1.4rem, 4.5vw, 2.8rem) clamp(1rem, 4vw, 2.6rem);
    border-radius: clamp(22px, 4vw, 36px);
    background: linear-gradient(160deg, rgba(255,255,255,.14), rgba(255,255,255,0) 50%), rgba(10,22,44,.28);
    border: 1px solid var(--line);
    box-shadow: 0 24px 70px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.35);
    -webkit-backdrop-filter: blur(16px) saturate(1.25);
    backdrop-filter: blur(16px) saturate(1.25);
  }
  .controls { position: fixed; z-index: 3; top: calc(env(safe-area-inset-top, 0px) + .8rem); right: calc(env(safe-area-inset-right, 0px) + .8rem); display: flex; gap: .5rem; transition: opacity .5s; }
  .controls button { display: inline-flex; align-items: center; gap: .45rem; font: inherit; font-size: .82rem; font-weight: 500; color: var(--fg); cursor: pointer; padding: .5rem .85rem; border-radius: 999px; border: 1px solid var(--line); background: rgba(10,22,44,.28); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .clockcol { min-width: 0; }
  .controls button[hidden] { display: none; }
  .controls button:hover { background: rgba(10,22,44,.42); }
  .controls button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  .controls button[aria-pressed="false"] .w, .controls button[aria-pressed="true"] .x { display: none; }
  html.idle .controls { opacity: 0; pointer-events: none; }
  html.idle, html.idle body { cursor: none; }
  .controls button { min-height: 44px; }
  @media (max-width: 520px) { .controls .lbl { display: none; } .controls button { padding: 0; width: 44px; justify-content: center; } }


  /* ---------- Responsive ---------- */
  /* Celular vertical: dejar espacio a los botones y aprovechar el ancho */
  @media (max-width: 600px) {
    main { padding-top: 4rem; padding-bottom: max(14vh, 120px); }
    .glass { padding: 1.4rem 1rem; border-radius: 24px; }
    .t12 { gap: .08em; }
    .divider { width: 80%; }
  }
  @media (max-width: 360px) {
    .t12 { font-size: 2.5rem; }
    .weather .wrow { grid-template-columns: repeat(2, 1fr); }
  }
  /* Tablet vertical */
  @media (min-width: 601px) and (max-width: 1024px) and (orientation: portrait) {
    main { padding-top: 4.5rem; }
    .glass { padding-block: 2.6rem; }
  }
  /* Pantallas bajas y apaisadas (celular o tablet horizontal): dos columnas */
  @media (orientation: landscape) and (max-height: 560px) {
    main { width: min(100%, 64rem); padding-top: 3.6rem; padding-bottom: 100px; }
    .glass { display: grid; grid-template-columns: 1.25fr 1fr; align-items: center; gap: 1rem clamp(1rem, 3vw, 2.4rem); padding: 1.1rem 1.4rem; border-radius: 24px; max-width: none; }
    .t12 { margin-top: .8rem; font-size: clamp(2.4rem, min(9vw, 17vh), 5.5rem); }
    .t24 { font-size: clamp(1.5rem, min(5vw, 9vh), 3rem); }
    .divider { margin: .8rem auto; }
    .weather { margin: 0; width: 100%; padding-left: clamp(1rem, 3vw, 2.4rem); border-left: 1px solid var(--line); }
    .weather .wrow { grid-template-columns: repeat(auto-fit, minmax(4.4rem, 1fr)); }
    .zone { margin-top: .8rem; }
    svg.andes { height: 22vh; min-height: 80px; }
    .controls { top: calc(env(safe-area-inset-top, 0px) + .5rem); }
  }
  /* Notch / barra lateral en horizontal */
  @supports (padding: max(0px)) {
    main { padding-left: max(clamp(.75rem, 5vw, 3rem), env(safe-area-inset-left, 0px)); padding-right: max(clamp(.75rem, 5vw, 3rem), env(safe-area-inset-right, 0px)); }
  }

  .t12 .sep { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .t12 .sep { animation: none; } }
</style>
</head>
<body>
  <canvas id="fx" aria-hidden="true"></canvas>
  <canvas id="sea" aria-hidden="true"></canvas>

  <div class="controls">
    <button type="button" id="btnSound" aria-pressed="false" title="Sonido ambiente" aria-label="Sonido ambiente">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path class="w" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/><path class="x" d="m16 9 5 6m0-6-5 6"/></svg>
      <span class="lbl">Sonido</span>
    </button>
    <button type="button" id="btnFs" title="Pantalla completa" aria-label="Pantalla completa" hidden>
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      <span class="lbl">Pantalla completa</span>
    </button>
  </div>

  <main>
    <div class="glass">
    <div class="clockcol">
    <p class="place">Santiago de Chile</p>
    <p class="date" id="date">&nbsp;</p>

    <div class="t12" id="t12" aria-label="Hora en formato de 12 horas">
      <span id="h12">--</span><span class="sep">:</span><span id="m12">--</span><span class="sec">:<span id="s12">--</span></span>
      <span class="ampm" id="ampm">--</span>
    </div>

    <div class="divider"></div>

    <div class="t24" id="t24" aria-label="Hora en formato de 24 horas">--:--:--</div>
    <p class="label">Formato de 24 horas</p>
    </div>

    <section class="weather" aria-live="polite">
      <p class="wplace">Clima de hoy en Talcahuano, Biobío</p>
      <div class="wmain">
        <span class="wicon" id="wicon" aria-hidden="true"></span>
        <div>
          <div class="wtemp" id="wtemp">--°</div>
          <div class="wcond" id="wcond">Cargando clima…</div>
        </div>
      </div>
      <div class="wrow" id="wrow"></div>
      <p class="wnote" id="wnote"></p>
    </section>
    </div>
  </main>

  <svg class="andes" viewBox="0 0 1440 300" preserveAspectRatio="none" aria-hidden="true">
    <path class="far" d="M0 300V170l90-60 80 40 110-90 100 80 90-50 120 100 100-70 130 90 110-110 120 100 90-40 100 70 100-50 90 70v90z"/>
    <path class="near" d="M0 300V230l120-50 90 40 130-70 110 70 120-40 140 60 110-60 150 70 120-50 110 50 130-40v140z"/>
  </svg>

<script>
(function () {
  var TZ = "America/Santiago";
  var $ = function (id) { return document.getElementById(id); };

  var f12 = new Intl.DateTimeFormat("en-US", { timeZone: TZ, hour: "numeric", minute: "2-digit", second: "2-digit", hour12: true });
  var f24 = new Intl.DateTimeFormat("en-GB", { timeZone: TZ, hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" });
  var fDate = new Intl.DateTimeFormat("es-CL", { timeZone: TZ, weekday: "long", day: "numeric", month: "long", year: "numeric" });
  var fOff = new Intl.DateTimeFormat("en-US", { timeZone: TZ, timeZoneName: "shortOffset" });

  function part(parts, type) {
    for (var i = 0; i < parts.length; i++) if (parts[i].type === type) return parts[i].value;
    return "";
  }

  var lastPhase = "", lastDate = "";

  /* ---------- Cielo continuo según la hora (amanecer, día, atardecer, noche) ---------- */
  var hNow = 0, daylight = 0, sr = 6.75, ss = 20.8, skyC = null; /* amanecer y atardecer en horas decimales */
  var NIGHT = [[5,13,31],[15,36,71],[31,67,115],[8,20,42],[13,32,64]];
  var DAWN  = [[58,58,122],[200,104,138],[255,183,133],[42,35,80],[74,55,104]];
  var DAY   = [[24,92,184],[58,138,226],[140,200,245],[43,79,122],[74,118,166]];
  var DUSK  = [[42,33,84],[181,71,106],[255,154,90],[27,20,56],[58,36,80]];
  var SKYVARS = ["--sky-top", "--sky-mid", "--sky-low", "--ridge", "--ridge-2"];

  function mixC(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  function skyAt(h) {
    var K = [[0, NIGHT, 0], [sr - 1.2, NIGHT, 0], [sr, DAWN, .5], [sr + 1.6, DAY, 1], [ss - 1.8, DAY, 1], [ss, DUSK, .5], [ss + 1.3, NIGHT, 0], [24, NIGHT, 0]];
    for (var i = 0; i < K.length - 1; i++) {
      if (h >= K[i][0] && h <= K[i + 1][0]) {
        var span = K[i + 1][0] - K[i][0], t = span ? (h - K[i][0]) / span : 0;
        return { c: K[i][1].map(function (c, n) { return mixC(c, K[i + 1][1][n], t); }), d: K[i][2] + (K[i + 1][2] - K[i][2]) * t };
      }
    }
    return { c: NIGHT, d: 0 };
  }
  function applySky() {
    var r = skyAt(hNow), st = document.documentElement.style;
    daylight = r.d; skyC = r.c;
    for (var i = 0; i < SKYVARS.length; i++) {
      var c = r.c[i];
      st.setProperty(SKYVARS[i], "rgb(" + Math.round(c[0]) + "," + Math.round(c[1]) + "," + Math.round(c[2]) + ")");
    }
  }

  function phaseFor(h) {
    if (h >= 6 && h < 8) return "dawn";
    if (h >= 8 && h < 18) return "day";
    if (h >= 18 && h < 20) return "dusk";
    return "night";
  }

  function tick() {
    var now = new Date();
    var p12 = f12.formatToParts(now);
    var p24 = f24.formatToParts(now);

    $("h12").textContent = part(p12, "hour");
    $("m12").textContent = part(p12, "minute");
    $("s12").textContent = part(p12, "second");
    $("ampm").textContent = part(p12, "dayPeriod").replace(/\./g, "").toUpperCase();

    var h = part(p24, "hour"), m = part(p24, "minute"), s = part(p24, "second");
    $("t24").textContent = h + ":" + m + ":" + s;

    hNow = parseInt(h, 10) + parseInt(m, 10) / 60 + parseInt(s, 10) / 3600;
    applySky();

    var d = fDate.format(now);
    if (d !== lastDate) {
      lastDate = d;
      $("date").textContent = d;
      var off = part(fOff.formatToParts(now), "timeZoneName").replace("GMT", "UTC").replace("-", "\u2212");
    }

    setTimeout(tick, 1000 - (now.getMilliseconds()));
  }
  tick();

  /* ---------- Fondo animado según el clima ---------- */
  var cv = $("fx"), cx = cv.getContext("2d");
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var W = 0, H = 0, scene = { kind: "cloudy", isDay: lastPhase !== "night" };
  var real = { kind: scene.kind, isDay: scene.isDay }, preview = false;
  var stars = [], clouds = [], drops = [], flakes = [], flash = 0, nextFlash = 3, lastT = 0, clock = 0;
  var birds = [], nextBird = 4, celX = 0, celA = 0, celUp = true, celRGB = "255,214,160";
  var sea = $("sea"), sx = sea.getContext("2d"), SH = 100;

  function kindOf(c) {
    if (c === 0 || c === 1) return "clear";
    if (c === 2) return "partly";
    if (c === 45 || c === 48) return "fog";
    if (c >= 51 && c <= 57) return "drizzle";
    if ((c >= 61 && c <= 67) || c === 80 || c === 81) return "rain";
    if (c === 82 || (c >= 95 && c <= 99)) return "storm";
    if ((c >= 71 && c <= 77) || c === 85 || c === 86) return "snow";
    return "cloudy";
  }
  function rnd(a, b) { return a + Math.random() * (b - a); }

  function build() {
    var k = scene.kind, wet = k === "drizzle" || k === "rain" || k === "storm";
    stars = []; clouds = []; drops = []; flakes = [];
    for (var i = 0; i < 110; i++) stars.push({ x: Math.random() * W, y: Math.random() * H * 0.65, r: rnd(.4, 1.5), ph: rnd(0, 6.28) });
    var nc = { clear: 0, partly: 5, cloudy: 9, fog: 6, drizzle: 10, rain: 11, storm: 12, snow: 8 }[k] || 0;
    nc = Math.round(nc * Math.min(1, Math.max(.55, W / 900)));
    for (i = 0; i < nc; i++) {
      var low = k === "fog";
      clouds.push({ x: rnd(-W * .3, W * 1.1), y: low ? rnd(H * .4, H * .85) : rnd(-H * .02, H * .5), s: low ? rnd(260, 480) : rnd(150, 340), v: rnd(6, 20), a: low ? rnd(.16, .3) : rnd(.28, .55), ph: rnd(0, 6.28) });
    }
    if (wet) {
      var area = W * H, n = Math.round(area / (k === "storm" ? 2800 : k === "rain" ? 4500 : 9000));
      for (i = 0; i < n; i++) drops.push({ x: Math.random() * W, y: Math.random() * H, l: k === "drizzle" ? rnd(6, 12) : rnd(11, 24), v: k === "drizzle" ? rnd(380, 520) : rnd(650, 1050) });
    }
    if (k === "snow") {
      for (i = 0; i < Math.round(W * H / 9000); i++) flakes.push({ x: Math.random() * W, y: Math.random() * H, r: rnd(1.2, 3.4), v: rnd(24, 70), ph: rnd(0, 6.28) });
    }
  }

  function setScene(kind, isDay) { scene = { kind: kind, isDay: isDay }; build(); updateSound(); if (reduce) frame(lastT); }

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    SH = Math.max(90, Math.round(H * .13));
    sea.width = Math.round(W * dpr); sea.height = Math.round(SH * dpr); sea.style.height = SH + "px";
    sx.setTransform(dpr, 0, 0, dpr, 0, 0);
    build();
    if (reduce) frame(lastT);
  }

  function cloudRGB() {
    var k = scene.kind, wet = k === "drizzle" || k === "rain" || k === "storm", n, d, c;
    if (k === "fog") { n = [140, 156, 182]; d = [228, 234, 240]; }
    else if (wet) { n = [72, 88, 112]; d = [150, 162, 176]; }
    else if (k === "snow") { n = [110, 128, 156]; d = [214, 224, 236]; }
    else { n = [122, 142, 176]; d = [255, 255, 255]; }
    c = mixC(n, d, daylight);
    var twi = 1 - Math.abs(2 * daylight - 1); /* máximo al amanecer y atardecer */
    c = mixC(c, wet ? [210, 150, 130] : [255, 168, 130], twi * (wet ? .25 : .5));
    return Math.round(c[0]) + "," + Math.round(c[1]) + "," + Math.round(c[2]);
  }

  /* mar: ondas suaves y reflejo del sol o la luna */
  function drawSea(k) {
    var c = skyC || NIGHT, i, j, g;
    var a = mixC(c[2], [8, 40, 72], .45), b = mixC(c[3], [2, 14, 32], .35);
    sx.clearRect(0, 0, W, SH);
    g = sx.createLinearGradient(0, 0, 0, SH);
    g.addColorStop(0, "rgb(" + a.map(Math.round).join(",") + ")");
    g.addColorStop(1, "rgb(" + b.map(Math.round).join(",") + ")");
    sx.fillStyle = g; sx.fillRect(0, 0, W, SH);

    if (celA > .02) {
      g = sx.createRadialGradient(celX, 0, 0, celX, 0, SH * 1.3);
      g.addColorStop(0, "rgba(" + celRGB + "," + (.3 * celA).toFixed(3) + ")"); g.addColorStop(1, "rgba(" + celRGB + ",0)");
      sx.fillStyle = g; sx.fillRect(0, 0, W, SH);
    }

    var amp = k === "storm" ? 5 : (k === "rain" ? 3.5 : 2.2), sp = k === "storm" ? 1.6 : 1;
    sx.lineWidth = 1; sx.strokeStyle = "rgba(255,255,255," + (.07 + .05 * daylight).toFixed(3) + ")";

          temp: j.current.temperature_2m, code: currentCode, isDay: j.current.is_day === 1,
          max: j.daily.temperature_2m_max[0], min: j.daily.temperature_2m_min[0],
          rain: j.daily.precipitation_probability_max[0] || 0,
          precip: currentPrecip, currentProb: currentProb,
          feels: j.current.apparent_temperature, cloud: j.current.cloud_cover,
          visibility: j.current.visibility,
          wind: j.current.wind_speed_10m, gusts: j.current.wind_gusts_10m,
          hum: j.current.relative_humidity_2m,
          dataTime: j.current.time ? j.current.time.slice(11, 16) : null,
          sunrise: sa0 ? sa0.split("T")[1] : null, sunset: sb0 ? sb0.split("T")[1] : null
        }, true);
      }).catch(function () { if (!done) { done = true; clearTimeout(timer); fallback(); } });
    } catch (e) { done = true; clearTimeout(timer); fallback(); }
  }
  loadWeather();
  setInterval(loadWeather, 15 * 60 * 1000);
})();
</script>
